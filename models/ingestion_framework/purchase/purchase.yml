version: 2
 
models:
  # Model name must match the filename of a model -- including case sensitivity
  - name: purchase
    meta:
      integration:                                     # -----------Configuration of Integration/Source system --------------
        integration_name: RETAIL                           # Name of integration or source system 
        integration_reporting_name: Retail Product Sales # Dispay Name of the source system in reporting or front end applications
        integration_type: File                              # Type of source system file , database or rest api based
        integration_owner: Koteswar                         # Owner of the source system
        inbound: true # true|false                          # specify True if the source system is Loading data to target data platform
        active: true  # true|false                          # specify True if the source system is active
      job:                                             # -----------Configuration of Job details ----------------------------
        ingestion_tool_name: dbt cloud                      # Integration tool name used for loading the table
        job_name: job_dbt_purchase_src_load                  # Integration Job name used for loading the table
        cron_schedule: "30 6 * * *"                          # Schedule of the job configured in integration tool
        humanized_schedule: "Daily once at 12PM IST"             # Schedule of the job configured in integration tool
      source_location_conf:                             # ----------Configuration of Source object details and target table details -------
        file_type: csv                                      # Type of file (csv|json|xml|parquet)
        filename:                          # Name of the file 
        files: []                                           # List of file names
        pattern: .*purchase_[0-9]{14}\.csv                                           # Pattern of the file
        stage_name: "{{ env_var('DBT_ENV_DB') }}.BRONZE.AWS_STAGE_DICOE"                       # External stage name configured in the target data platform
        stage_landing_path: DBT_METADATA/INGESTION_FRAMEWORK/Purchase_Incremental            # Landing path where the files are available for loading in external stage
        stage_archive_path: DBT_METADATA/ARCHIVE            # Archival path where the files need to be moved after successful loading
        stage_error_path: path/to/the/location              # Error path where the files need to be moved if file loading failed
        file_format: "{{ env_var('DBT_ENV_DB') }}.BRONZE.CSV_FILE_FORMAT"                        # File format name configured in the target data platform
        partitioned:                                        # Specify True|False if partition need to be considered while loading
        partition_key:                                      # Specify the partition key
        copy_options: 'PURGE = False
 
          FORCE = False'                                    # Copy Options need to be considered whil loading
        validation_mode:                                    # Specify the validation mode 
      stage_table: 
        enabled: true                                        # Specify True if stage table is applicable
        database: "{{ env_var('DBT_ENV_DB') }}"                                # Specify the database name of stage table
        schema: BRONZE                                      # Specify the schema name of stage table
        stage_table_name: STG_PURCHASE                            # Specify the name of the stage table      
      raw_table:     
        primary_keys: ['PURCHASE_ID']               # Specify the primary key to be used while creating DDL for Raw table
        database: "{{ env_var('DBT_ENV_DB') }}"                                  # Specify the  database name of raw table
        schema: BRONZE                                        # Specify the schema name of raw table
        raw_table_name: PURCHASE                                       # Specify the name of raw table
    columns:
      - name: PURCHASE_ID # required               # Specify the column of your target table
        data_type: VARCHAR(200)
        description: ""
        meta:
          contains_pii: false                       # Specify if PII information 
          source_column: PURCHASE_ID                # Specify source column mapped to the corresponding target column
          source_column_position: $1                # Specify the poistion of source column in file
          copy_transformation_logic:                # Specify the copy transformation logic supported by the COPY INTO
          transformation_logic:                     # Specify the transformation logic to be applied while loading from STG TO RAW table
        tests:
          - unique
      - name: CUSTOMER_ID # required               # Specify the column of your target table
        data_type: INT
        description: ""
        meta:
          contains_pii: false                       # Specify if PII information 
          source_column: CUSTOMER_ID                # Specify source column mapped to the corresponding target column
          source_column_position: $2                # Specify the poistion of source column in file
          copy_transformation_logic:                # Specify the copy transformation logic supported by the COPY INTO
          transformation_logic:                     # Specify the transformation logic to be applied while loading from STG TO RAW table
      - name: PRODUCT_ID # required               # Specify the column of your target table
        data_type: VARCHAR(200)
        description: ""
        meta:
          contains_pii: false                       # Specify if PII information 
          source_column: PRODUCT_ID                # Specify source column mapped to the corresponding target column
          source_column_position: $3               # Specify the poistion of source column in file
          sql_column_datatype: VARCHAR(200)                  # Specify the SQL data type to be considered while creating the target table
          copy_transformation_logic:                # Specify the copy transformation logic supported by the COPY INTO
          transformation_logic:                     # Specify the transformation logic to be applied while loading from STG TO RAW table
      - name: PRODUCT_NAME # required               # Specify the column of your target table
        data_type: VARCHAR(200)
        description: ""
        meta:
          contains_pii: false                       # Specify if PII information 
          source_column: PRODUCT_NAME                # Specify source column mapped to the corresponding target column
          source_column_position: $4               # Specify the poistion of source column in file
          sql_column_datatype: VARCHAR(200)                  # Specify the SQL data type to be considered while creating the target table
          copy_transformation_logic:                # Specify the copy transformation logic supported by the COPY INTO
          transformation_logic:                     # Specify the transformation logic to be applied while loading from STG TO RAW table
      - name: RATE               # Specify the column of your target table
        data_type: FLOAT
        description: ""
        meta:
          contains_pii: false                       # Specify if PII information 
          source_column: RATE                # Specify source column mapped to the corresponding target column
          source_column_position: $5               # Specify the poistion of source column in file
          copy_transformation_logic:                # Specify the copy transformation logic supported by the COPY INTO
          transformation_logic:                     # Specify the transformation logic to be applied while loading from STG TO RAW table
      - name: QUANTITY                # Specify the column of your target table
        data_type: INT
        description: ""
        meta:
          contains_pii: false                       # Specify if PII information 
          source_column: QUANTITY                 # Specify source column mapped to the corresponding target column
          source_column_position: $6               # Specify the poistion of source column in file
          copy_transformation_logic:                # Specify the copy transformation logic supported by the COPY INTO
          transformation_logic:                     # Specify the transformation logic to be applied while loading from STG TO RAW table              
      - name: TOTAL_COST                # Specify the column of your target table
        data_type: FLOAT
        description: ""
        meta:
          contains_pii: false                       # Specify if PII information 
          source_column: TOTAL_COST                 # Specify source column mapped to the corresponding target column
          source_column_position: $7              # Specify the poistion of source column in file
          copy_transformation_logic:                # Specify the copy transformation logic supported by the COPY INTO
          transformation_logic:                     # Specify the transformation logic to be applied while loading from STG TO RAW table                 
      - name: PURCHASE_DATE                # Specify the column of your target table
        data_type: TIMESTAMP_NTZ(9)
        description: ""
        meta:
          contains_pii: false                       # Specify if PII information 
          source_column: PURCHASE_DATE                 # Specify source column mapped to the corresponding target column
          source_column_position: $8             # Specify the poistion of source column in file
          copy_transformation_logic:    # Specify the copy transformation logic supported by the COPY INTO
          transformation_logic:         # Specify the transformation logic to be applied while loading from STG TO RAW table 
      - name: FILE_NAME                # Specify the column of your target table
        data_type: VARCHAR(500)
        description: ""
        meta:
          raw_table: false            
          contains_pii: false                      # Specify if PII information 
          source_column:                  # Specify source column mapped to the corresponding target column
          source_column_position:              # Specify the poistion of source column in file
          sql_column_datatype: VARCHAR(500)                 # Specify the SQL data type to be considered while creating the target table
          copy_transformation_logic: metadata$filename   # Specify the copy transformation logic supported by the COPY INTO
          transformation_logic:                  # Specify the transformation logic to be applied while loading from STG TO RAW table
      - name: ETL_LOADED_TIME                # Specify the column of your target table
        data_type: TIMESTAMP_NTZ(9)
        description: ""
        meta:
          contains_pii: false                       # Specify if PII information 
          source_column:                  # Specify source column mapped to the corresponding target column
          source_column_position:              # Specify the poistion of source column in file
          sql_column_datatype: TIMESTAMP_NTZ(9)             # Specify the SQL data type to be considered while creating the target table
          copy_transformation_logic: current_timestamp()   # Specify the copy transformation logic supported by the COPY INTO
          transformation_logic:  current_timestamp()       # Specify the transformation logic to be applied while loading from STG TO RAW table 